<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteur de points</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative min-h-screen flex flex-col items-center text-gray-800">

    <!-- Image de fond floutée -->
    <div class="absolute inset-0">
        <img src="{{ url_for('static', filename='images/background.png') }}" class="w-full h-full object-cover" alt="Background">
    </div>
    <div class="absolute inset-0 bg-black/40 backdrop-blur-lg"></div>

    {% include 'navbar.html' %}

    <div class="relative z-10 w-full max-w-5xl px-4 pb-16 space-y-6">

        <div class="bg-white/20 backdrop-blur-md shadow-2xl rounded-2xl p-6 space-y-4">
            <h1 class="text-2xl font-bold text-white text-center">📍 Compteur de points</h1>
            <p class="text-center text-indigo-100 text-sm">
                Charge une image, puis clique dessus pour y poser un point numéroté.
                Clic droit sur un point pour le supprimer.
            </p>

            <!-- Zone de chargement -->
            <div id="drop-zone" class="border-2 border-dashed border-indigo-300/70 rounded-xl p-6 text-center cursor-pointer transition hover:border-blue-500 hover:bg-blue-500/10">
                <input type="file" id="file-input" accept="image/*" class="hidden">
                <span class="text-white font-medium">Clique ou dépose une image ici</span>
            </div>

            <!-- Barre d'outils -->
            <div class="flex flex-wrap items-center justify-center gap-3">
                <span class="text-white font-semibold bg-black/40 px-4 py-2 rounded-lg">
                    Points : <span id="count">0</span>
                </span>
                <button id="undo" class="btn">↩️ Annuler</button>
                <button id="reset" class="btn">🗑️ Tout effacer</button>
                <button id="export" class="btn">💾 Exporter l'image</button>
                <label class="text-white text-sm flex items-center gap-2 bg-black/40 px-3 py-2 rounded-lg">
                    Taille
                    <input type="range" id="size" min="8" max="40" value="16">
                </label>
            </div>
        </div>

        <!-- Zone image + points -->
        <div class="bg-white/20 backdrop-blur-md shadow-2xl rounded-2xl p-4 flex justify-center">
            <div id="stage" class="relative inline-block max-w-full select-none">
                <img id="photo" class="max-w-full h-auto rounded-lg hidden" alt="Image à annoter">
                <div id="points" class="absolute inset-0 pointer-events-none"></div>
                <p id="placeholder" class="text-white/80 py-16">Aucune image chargée pour le moment.</p>
            </div>
        </div>
    </div>

    <style>
        .btn {
            background-color: #2563eb;
            color: white;
            padding: 0.5rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .btn:hover {
            background-color: #1d4ed8;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
        }
        .point {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            background-color: #ef4444;
            color: white;
            font-weight: 700;
            line-height: 1;
            border: 2px solid white;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            pointer-events: auto; /* le calque parent est en pointer-events:none */
        }
    </style>

    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const photo = document.getElementById('photo');
        const pointsLayer = document.getElementById('points');
        const placeholder = document.getElementById('placeholder');
        const countLabel = document.getElementById('count');
        const sizeInput = document.getElementById('size');

        // Coordonnées stockées en pourcentage de l'image : l'affichage reste
        // correct même si l'image est redimensionnée par le navigateur.
        let points = [];
        let pointSize = parseInt(sizeInput.value, 10);

        function render() {
            pointsLayer.innerHTML = '';
            points.forEach((point, index) => {
                const dot = document.createElement('div');
                dot.className = 'point';
                dot.style.left = point.x + '%';
                dot.style.top = point.y + '%';
                dot.style.width = pointSize * 2 + 'px';
                dot.style.height = pointSize * 2 + 'px';
                dot.style.fontSize = pointSize * 0.9 + 'px';
                dot.textContent = index + 1;
                dot.addEventListener('contextmenu', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    points.splice(index, 1);
                    render();
                });
                pointsLayer.appendChild(dot);
            });
            countLabel.textContent = points.length;
        }

        function loadImage(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                photo.src = event.target.result;
                photo.classList.remove('hidden');
                placeholder.classList.add('hidden');
                points = [];
                render();
            };
            reader.readAsDataURL(file);
        }

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (event) => loadImage(event.target.files[0]));
        dropZone.addEventListener('dragover', (event) => {
            event.preventDefault();
            dropZone.classList.add('border-blue-500');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-blue-500'));
        dropZone.addEventListener('drop', (event) => {
            event.preventDefault();
            dropZone.classList.remove('border-blue-500');
            loadImage(event.dataTransfer.files[0]);
        });

        photo.addEventListener('click', (event) => {
            const rect = photo.getBoundingClientRect();
            points.push({
                x: ((event.clientX - rect.left) / rect.width) * 100,
                y: ((event.clientY - rect.top) / rect.height) * 100
            });
            render();
        });

        document.getElementById('undo').addEventListener('click', () => {
            points.pop();
            render();
        });

        document.getElementById('reset').addEventListener('click', () => {
            points = [];
            render();
        });

        document.addEventListener('keydown', (event) => {
            if (event.ctrlKey && event.key === 'z') {
                points.pop();
                render();
            }
        });

        sizeInput.addEventListener('input', () => {
            pointSize = parseInt(sizeInput.value, 10);
            render();
        });

        // Export : on redessine l'image et les points à leur taille réelle.
        document.getElementById('export').addEventListener('click', () => {
            if (!photo.src) return;
            const scale = photo.naturalWidth / photo.clientWidth;
            const canvas = document.createElement('canvas');
            canvas.width = photo.naturalWidth;
            canvas.height = photo.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(photo, 0, 0);

            const radius = pointSize * scale;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 2 * scale;
            ctx.strokeStyle = '#ffffff';
            ctx.font = 'bold ' + (radius * 0.9) + 'px sans-serif';

            points.forEach((point, index) => {
                const x = (point.x / 100) * canvas.width;
                const y = (point.y / 100) * canvas.height;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ef4444';
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.fillText(index + 1, x, y);
            });

            const link = document.createElement('a');
            link.download = 'points.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
