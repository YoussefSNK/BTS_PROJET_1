<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une Image</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    boxShadow: {
                        'glow': '0 0 20px rgba(59, 130, 246, 0.8)',
                    }
                }
            }
        };
    </script>
</head>
<body class="relative min-h-screen flex flex-col items-center justify-center text-gray-800 overflow-hidden">

    <!-- Conteneur des particules -->
    <div id="particles-js" class="absolute inset-0"></div>

    <!-- Image de fond floutée avec effet de mouvement -->
    <div class="absolute inset-0 animate-move-bg">
        <img src="{{ url_for('static', filename='images/background.png') }}" class="w-full h-full object-cover blur-xs" alt="Background">
    </div>

    <!-- Overlay semi-transparent -->
    <div class="absolute inset-0 bg-black/30 backdrop-blur-lg"></div>

    {% include 'navbar.html' %}

    <!-- Conteneur principal avec effet glassmorphism -->
    <div class="relative z-10 max-w-lg w-full bg-white/20 backdrop-blur-md shadow-2xl rounded-2xl p-8 transition-all duration-300 hover:shadow-glow opacity-0 transform scale-95 animate-fade-in space-y-10">

        <!-- Formulaire 1 : nouveau modele (image originale) -->
        <div>
            <h1 class="text-2xl font-bold text-white text-center mb-6">1. Nouveau modèle</h1>
            <form action="{{ url_for('pearl_bp.create_model') }}" method="post" enctype="multipart/form-data" class="space-y-4">
                <div>
                    <label for="model_nom" class="block text-lg font-medium text-white">Nom du modèle :</label>
                    <input type="text" name="model_nom" id="model_nom" required class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-100/80" placeholder="Nom du modèle">
                </div>
                <div class="drop-zone relative border-2 border-dashed border-blue-400 rounded-lg p-6 text-center cursor-pointer transition hover:bg-blue-400/10">
                    <input type="file" name="model_image" id="model_image" accept="image/*" required class="hidden">
                    <p class="text-lg text-white">📂 Image originale du modèle</p>
                    <img class="hidden mt-4 max-h-40 mx-auto rounded-lg shadow-md" alt="Aperçu">
                </div>
                <button type="submit" class="btn w-full">
                    <span class="icon">➕</span> Créer le modèle
                </button>
            </form>
        </div>

        <hr class="border-white/30">

        <!-- Vos modeles : cliquer pour ouvrir la grille liste x dithering -->
        <div>
            <h1 class="text-2xl font-bold text-white text-center mb-6">Vos modèles</h1>
            {% if models %}
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                {% for model in models %}
                    <a href="{{ url_for('pearl_bp.model_detail', model_id=model[0]) }}"
                       class="block bg-white/20 hover:bg-white/30 rounded-lg p-2 text-center transition">
                        <img src="{{ url_for('static', filename='images/' + model[2]) }}" alt="{{ model[1] }}"
                             class="w-full h-24 object-cover rounded-md mb-2">
                        <span class="text-white text-sm font-medium truncate block">{{ model[1] }}</span>
                    </a>
                {% endfor %}
            </div>
            {% else %}
            <p class="text-white text-center">Crée un modèle ci-dessus pour commencer.</p>
            {% endif %}
        </div>
    </div>

    <style>
        /* Effet d’animation de l’image de fond */
        @keyframes moveBackground {
            0% { transform: scale(1.05) translateY(0); }
            50% { transform: scale(1.05) translateY(-10px); }
            100% { transform: scale(1.05) translateY(0); }
        }
        .animate-move-bg {
            animation: moveBackground 8s ease-in-out infinite;
        }

        /* Animation d'apparition */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        /* Effet lumineux au survol */
        .btn {
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #2563eb; /* bg-blue-600 */
                color: #ffffff; /* text-white */
                padding-top: 0.75rem; /* py-3 */
                padding-bottom: 0.75rem; /* py-3 */
                padding-left: 1.5rem; /* px-6 */
                padding-right: 1.5rem; /* px-6 */
                border-radius: 0.5rem; /* rounded-lg */
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-lg */
                font-size: 1.125rem; /* text-lg */
                font-weight: 500; /* font-medium */
                transition: background-color 0.3s, box-shadow 0.3s; /* transition duration-300 */
            }
            .btn:hover {
                background-color: #1d4ed8; /* hover:bg-blue-700 */
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.8); /* hover:shadow-glow */
            gap: 10px;
        }

        /* Style du drag & drop */
        .drop-zone {
            position: relative;
            transition: border-color 0.3s, background 0.3s;
        }
        .drop-zone:hover {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.1);
        }
    </style>

    <!-- Script pour les particules -->
    <script>
        particlesJS("particles-js", {
            particles: {
                number: { value: 100, density: { enable: true, value_area: 800 } },
                color: { value: "#ffffff" },
                shape: { type: "circle" },
                opacity: { value: 0.6, random: true, anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false } },
                size: { value: 3, random: true, anim: { enable: true, speed: 4, size_min: 0.3, sync: false } },
                move: { enable: true, speed: 1.5, direction: "none", random: true, straight: false, out_mode: "out" }
            },
            interactivity: {
                detect_on: "canvas",
                events: { onhover: { enable: true, mode: "repulse" }, onclick: { enable: true, mode: "push" } },
                modes: {
                    repulse: { distance: 80, duration: 0.4 },
                    push: { particles_nb: 4 }
                }
            },
            retina_detect: true
        });
    </script>

    <!-- Script pour l’upload avec Drag & Drop + prévisualisation -->
    <script>
        document.querySelectorAll('.drop-zone').forEach((dropZone) => {
            const fileInput = dropZone.querySelector('input[type="file"]');
            const preview = dropZone.querySelector('img');

            dropZone.addEventListener('click', () => fileInput.click());

            const showPreview = (file) => {
                if (!file || !preview) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            };

            fileInput.addEventListener('change', (event) => {
                showPreview(event.target.files[0]);
            });

            dropZone.addEventListener('dragover', (event) => {
                event.preventDefault();
                dropZone.classList.add('border-blue-500');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('border-blue-500');
            });

            dropZone.addEventListener('drop', (event) => {
                event.preventDefault();
                dropZone.classList.remove('border-blue-500');

                fileInput.files = event.dataTransfer.files;
                showPreview(event.dataTransfer.files[0]);
            });
        });
    </script>

</body>
</html>
