<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tama · atelier de perles</title>
<link rel="icon" href="{{ url_for('static', filename='icon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Zen Kaku Gothic New',sans-serif;background:#ECE5D8;color:#1A1714;}
*{box-sizing:border-box}
a{color:#B8322A;text-decoration:none}a:hover{text-decoration:underline}
input,select,textarea,button{font-family:inherit;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
#tama-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;font-size:22px;color:#5E564B;}

/* Tablette : la grille du detail modele et les cartes passent sur moins de colonnes. */
@media (max-width: 1100px) {
  .tm-cols{column-count:3 !important;}
  .tm-md{grid-template-columns:minmax(0,1fr) !important;}
  .tm-md-side{position:static !important; max-width:260px;}
}
/* Mobile : le rail devient une barre en haut, les titres et grilles se resserrent. */
@media (max-width: 820px) {
  .tm-shell{grid-template-columns:minmax(0,1fr) !important;}
  .tm-rail{position:relative !important; height:auto !important; padding:16px !important; gap:14px !important; flex-direction:row !important; flex-wrap:wrap; align-items:center;}
  .tm-nav{flex-direction:row !important; gap:14px !important; overflow-x:auto; width:100%; order:3;}
  .tm-nav-sub, .tm-nav-dot{display:none !important;}
  .tm-nav-label{font-size:18px !important; white-space:nowrap;}
  .tm-rail-foot{margin-top:0 !important; width:100%; flex-direction:row !important; justify-content:space-between; align-items:center; padding-right:0 !important;}
  .tm-main{padding:16px 16px 120px !important;}
  .tm-h1{font-size:52px !important;}
  .tm-3, .tm-2{grid-template-columns:minmax(0,1fr) !important;}
  .tm-cols{column-count:2 !important; column-gap:16px !important;}
  .tm-cells{grid-template-columns:72px repeat(4,minmax(150px,1fr)) !important; overflow-x:auto;}
  .tm-feasrow{grid-template-columns:20px 48px minmax(0,1fr) 64px 18px !important;}
  .tm-feasrow > .tm-feasbar{display:none !important;}
  .tm-feasexp{padding-left:18px !important;}
  .tm-gen{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
  .tm-list-row{grid-template-columns:24px 44px minmax(0,1fr) 150px 30px !important;}
  .tm-list-row > .tm-hide-sm{display:none !important;}
  .tm-pt{left:0 !important;}
  .tm-kpis{gap:20px !important; flex-wrap:wrap;}
}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
<script src="{{ url_for('static', filename='tama/ink-bg.js') }}"></script>
</head>
<body>
<div id="root" data-logout="{{ url_for('deconnexion_utilisateur') }}" data-login="{{ url_for('login_form') }}"><div id="tama-loading">珠 · chargement…</div></div>
<script src="{{ url_for('static', filename='tama/app.js') }}"></script>
</body>
</html>
